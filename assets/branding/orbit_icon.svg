<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <!-- Outer orbit ring -->
  <ellipse cx="512" cy="512" rx="310" ry="210" fill="none" stroke="#A5B4FC" stroke-width="36" opacity="0.9" transform="rotate(-24 512 512)"/>
  <!-- Inner orbit ring -->
  <ellipse cx="512" cy="512" rx="210" ry="130" fill="none" stroke="#C7D2FE" stroke-width="22" opacity="0.75" transform="rotate(18 512 512)"/>
  <!-- Core node -->
  <circle cx="512" cy="512" r="92" fill="#EEF2FF"/>
  <circle cx="512" cy="512" r="48" fill="#4F46E5"/>
  <!-- Progress satellite -->
  <circle cx="760" cy="400" r="46" fill="#22D3EE"/>
  <circle cx="760" cy="400" r="22" fill="#ECFEFF"/>
</svg>
