publish_to: 'none'
version: 3.1.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  flutter_local_notifications: ^22.3.1
